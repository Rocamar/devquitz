<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevQuiz - Quiz de JavaScript para principiantes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>DevQuiz</h1>
      <p>Quiz de programación para principiantes</p>
    </header>

    <!-- Sección del quiz: se muestra mientras se responde -->
    <section id="quiz">
      <div class="progreso">
        <div class="barra-progreso">
          <div class="relleno" id="relleno-progreso"></div>
        </div>
        <p class="texto-progreso" id="texto-progreso">Pregunta 1 de 10</p>
      </div>

      <article class="tarjeta-pregunta" id="tarjeta-pregunta">
        <span class="numero-pregunta" id="numero-pregunta">Pregunta 1</span>
        <h2 class="enunciado" id="enunciado"></h2>
        <ul class="opciones" id="opciones"></ul>
        <div class="explicacion" id="explicacion">
          <strong>Explicación:</strong> <span id="texto-explicacion"></span>
        </div>
        <button class="boton boton-siguiente" id="boton-siguiente">Siguiente pregunta →</button>
      </article>
    </section>

    <!-- Sección final: se muestra al terminar -->
    <section id="pantalla-final">
      <h2>¡Has terminado!</h2>
      <p id="resultado">Puntuación: <span id="puntaje">0</span> / 10</p>
      <p id="comentario"></p>
      <button class="boton boton-reiniciar" id="boton-reiniciar">Volver a empezar</button>
    </section>
  </main>

  <!-- scripts: questions.js define el array preguntas; app.js controla la lógica -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
